services:
  app_proxy:
    environment:
      APP_HOST: lex-apps-snapchat-memories-backend_app_1
      APP_PORT: 3333
      PROXY_AUTH_WHITELIST: "/api/*,/health"

  data_permissions:
    image: ghcr.io/lex-2610/memorys-backend:v1.0.1
    user: "0:0"
    restart: "no"
    command: ["sh", "-c", "chown 1000:1000 /app/data && chmod 700 /app/data"]
    volumes:
      - ${APP_DATA_DIR}/data:/app/data

  app:
    depends_on:
      data_permissions:
        condition: service_completed_successfully
    image: ghcr.io/lex-2610/memorys-backend:v1.0.1
    restart: on-failure
    init: true
    environment:
      ADMIN_PASSWORD: "snapmemories"
      DATA_PATH: /app/data
      NODE_ENV: production
      PORT: 3333
      HOST: 0.0.0.0
      MEDIA_PATH: /app/downloads
      CACHE_PATH: /app/.cache
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
      - ${APP_DATA_DIR}/media:/app/downloads:ro
