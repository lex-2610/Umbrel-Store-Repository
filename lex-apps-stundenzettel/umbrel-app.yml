description: >-
  Stundenzettel ist eine selbst gehostete Anwendung zur Erfassung und
  Verwaltung von Arbeitszeiten, Kunden, Projekten und zugehörigen Dateien.


  Die Anwendung läuft vollständig auf deinem Umbrel. Stundenzettel,
  Benutzerkonten, Bilder und Backups werden lokal im persistenten App-Speicher
  abgelegt. Beim ersten Start meldest du dich mit dem Benutzernamen admin und
  dem von Umbrel angezeigten App-Passwort an.
