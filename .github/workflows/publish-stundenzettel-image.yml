name: Publish Stundenzettel image

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-stundenzettel-image.yml
      - lex-apps-stundenzettel/umbrel-app.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  SOURCE_REPOSITORY: lex-2610/Template-Demo-Stundenzettel
  SOURCE_REF: 7a03402317b3775029d207f7c547e28da16339d9
  IMAGE_NAME: ghcr.io/lex-2610/stundenzettel-umbrel
  IMAGE_TAG: 14.0.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out application source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_REF }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:${{ env.SOURCE_REF }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ env.SOURCE_REPOSITORY }}
            org.opencontainers.image.revision=${{ env.SOURCE_REF }}
            org.opencontainers.image.version=${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

